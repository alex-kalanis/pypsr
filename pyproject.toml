[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'pypsr'
version = '0.1.0'
description = "Python's PHP Standard Recommendations"
authors = [
    { name = 'Petr Plsek' }
]
maintainers = [
    { name = 'Petr Plsek', email = 'me@kalanys.com' },
]
requires-python = '>=3.9'
readme = 'README.md'
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: PHP',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Software Development',
    'Typing :: Typed',
    'Operating System :: OS Independent',
]
# License info:
#   - The main pypsr project license is MIT (as for PHP PSR).
#   - The legal license is Creative Commons Legal 3.0
license = 'MIT AND CCL-3.0'
license-files = [
    'LICENSE_MIT.md', # MIT-Clause
    'LICENSE_CC.md', # CCL3-Clause
]
keywords = ['php', 'psr', 'php-psr']

[project.optional-dependencies]
test = [
    'pytest',
]
dev = [
    'pytest',
]

[project.urls]
homepage = 'https://github.com/alex-kalanis/pypsr'
documentation = 'https://www.php-fig.org/psr/'
source = 'https://github.com/alex-kalanis/pypsr'
download = 'https://pypi.org/project/pypsr/#files'
tracker = 'https://github.com/alex-kalanis/pypsr/issues'

###########################################################

[tool.setuptools.packages.find]
where = ["src"]
